<style id="leem-styles">

/* ── Contenedor del popup ────────────────────────────────── */
.leaflet-popup-content-wrapper {
    background: #1A1A18 !important;
    color: #F5F0E8 !important;
    border-radius: 16px !important;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important;
    padding: 0 !important;
    overflow: hidden !important;
}

.leaflet-popup-content {
    margin: 0 !important;
}

.leaflet-popup-tip {
    background: #1A1A18 !important;
}

.leaflet-popup-close-button {
    color: #F5F0E8 !important;
    font-size: 20px !important;
    top: 10px !important;
    right: 12px !important;
    z-index: 10 !important;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9) !important;
}

.leaflet-popup-close-button:hover {
    color: #29ABD4 !important;
}

/* ── La tabla se comporta como grilla de 2 columnas ──────── */
/* El navegador inserta un <tbody> implicito: display:contents lo hace
   transparente para que las filas sean hijas directas de la grilla */
.leaflet-popup-content table tbody {
    display: contents !important;
}

.leaflet-popup-content table {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    width: 100% !important;
    border-collapse: collapse !important;
    padding: 0 !important;
    margin: 0 !important;
}

/* Fila genérica de datos: etiqueta | valor */
.leaflet-popup-content table tr {
    grid-column: 1 / -1 !important;
    display: grid !important;
    grid-template-columns: 42% 1fr !important;
    align-items: baseline !important;
    padding: 10px 18px !important;
    border-bottom: 1px solid rgba(255,255,255,0.08) !important;
}

.leaflet-popup-content table th {
    font-family: Arial, Helvetica, sans-serif !important;
    font-size: 10px !important;
    letter-spacing: 0.09em !important;
    text-transform: uppercase !important;
    color: #C4B89A !important;
    font-weight: 700 !important;
    text-align: left !important;
    padding: 0 10px 0 0 !important;
    background: transparent !important;
    border: none !important;
    vertical-align: baseline !important;
}

.leaflet-popup-content table td {
    font-family: Georgia, serif !important;
    font-size: 13px !important;
    color: #F5F0E8 !important;
    text-align: right !important;
    padding: 0 0 0 12px !important;
    background: transparent !important;
    border: none !important;
    border-left: 1px solid rgba(255,255,255,0.06) !important;
    vertical-align: baseline !important;
}

/* ── Cabecera: foto a la izquierda ───────────────────────── */
.leaflet-popup-content table tr.leem-foto {
    grid-column: 1 !important;
    grid-row: 1 !important;
    display: block !important;
    padding: 0 !important;
    min-height: 158px !important;
    border-bottom: 1px solid rgba(255,255,255,0.08) !important;
}

td#image_url {
    display: block !important;
    height: 100% !important;
    min-height: 158px !important;
    padding: 0 !important;
    border: none !important;
}

#image_url img {
    width: 100% !important;
    max-width: none !important;
    height: 100% !important;
    min-height: 158px !important;
    object-fit: cover !important;
    display: block !important;
    border-radius: 0 !important;
    margin: 0 !important;
}

/* ── Cabecera: título a la derecha ───────────────────────── */
/* Sin foto, el título ocupa todo el ancho */
.leaflet-popup-content table tr.leem-lugar {
    grid-column: 1 / -1 !important;
    display: block !important;
    padding: 20px 34px 16px 18px !important;
    border-bottom: 1px solid rgba(255,255,255,0.08) !important;
}

/* Con foto, se sienta al lado derecho de ella */
.leaflet-popup-content table tr.leem-foto + tr.leem-lugar {
    grid-column: 2 !important;
    grid-row: 1 !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    padding: 18px 34px 18px 16px !important;
}

td#lugar {
    font-family: Georgia, serif !important;
    font-size: 19px !important;
    line-height: 1.18 !important;
    color: #F5F0E8 !important;
    text-align: left !important;
    padding: 0 !important;
    border: none !important;
    display: block !important;
    width: 100% !important;
}

.leem-ciudad {
    font-family: Arial, Helvetica, sans-serif !important;
    font-size: 11px !important;
    letter-spacing: 0.04em !important;
    color: #888780 !important;
    margin-top: 7px !important;
    font-style: normal !important;
}

/* ── Obra en cursiva dorada ──────────────────────────────── */
#titulo_lib {
    font-family: Georgia, serif !important;
    font-style: italic !important;
    color: #C4B89A !important;
}

/* ── Bloque inferior: cita a la izquierda ────────────────── */
.leaflet-popup-content table tr.leem-cita {
    grid-column: 1 !important;
    display: block !important;
    padding: 16px 10px 16px 18px !important;
    border-bottom: none !important;
}

.leaflet-popup-content table tr.leem-cita th {
    display: none !important;
}

td#cita {
    font-family: Georgia, serif !important;
    font-style: italic !important;
    color: #C4B89A !important;
    font-size: 12px !important;
    line-height: 1.55 !important;
    text-align: left !important;
    border-left: 3px solid #C4754A !important;
    border-radius: 0 !important;
    padding: 2px 0 2px 12px !important;
    display: block !important;
}

/* ── Bloque inferior: botón a la derecha ─────────────────── */
/* Sin cita, el botón ocupa todo el ancho */
.leaflet-popup-content table tr.leem-ruta {
    grid-column: 1 / -1 !important;
    display: block !important;
    padding: 14px 18px !important;
    border-bottom: none !important;
}

/* Con cita, se sienta a su derecha */
.leaflet-popup-content table tr.leem-cita + tr.leem-ruta {
    grid-column: 2 !important;
    display: flex !important;
    align-items: center !important;
    padding: 16px 18px 16px 10px !important;
}

.leaflet-popup-content table tr.leem-ruta th {
    display: none !important;
}

td#coordenada {
    padding: 0 !important;
    border: none !important;
    width: 100% !important;
    text-align: center !important;
}

#coordenada a {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 8px !important;
    width: 100% !important;
    box-sizing: border-box !important;
    padding: 15px 12px !important;
    background: #C4754A !important;
    color: #F5F0E8 !important;
    font-family: Georgia, serif !important;
    font-size: 13px !important;
    line-height: 1.25 !important;
    text-decoration: none !important;
    border-radius: 10px !important;
    text-align: center !important;
}

#coordenada a:hover {
    background: #B3633A !important;
}

/* ── Instagram ───────────────────────────────────────────── */
.leaflet-popup-content table tr.leem-insta {
    grid-column: 1 / -1 !important;
    display: block !important;
    padding: 10px 18px !important;
}

td#insta_url {
    padding: 0 !important;
    border: none !important;
    width: 100% !important;
}

#insta_url a {
    display: block !important;
    width: 100% !important;
    box-sizing: border-box !important;
    padding: 10px 12px !important;
    background: transparent !important;
    color: #C4B89A !important;
    font-family: Arial, Helvetica, sans-serif !important;
    font-size: 11px !important;
    letter-spacing: 0.04em !important;
    text-decoration: none !important;
    border: 1px solid #2C3E4A !important;
    border-radius: 10px !important;
    text-align: center !important;
}

#insta_url a:hover {
    border-color: #C4B89A !important;
    color: #F5F0E8 !important;
}

/* ── Pie de tarjeta ──────────────────────────────────────── */
.leaflet-popup-content table::after {
    content: 'LITERATURA EN EL MAPA' !important;
    grid-column: 1 / -1 !important;
    display: block !important;
    font-family: Arial, Helvetica, sans-serif !important;
    font-size: 9px !important;
    letter-spacing: 0.14em !important;
    color: #29ABD4 !important;
    opacity: 0.75 !important;
    text-align: center !important;
    padding: 12px 18px 14px !important;
    border-top: 1px solid rgba(255,255,255,0.08) !important;
}

/* ── Scrollbar ───────────────────────────────────────────── */
.leaflet-popup-content::-webkit-scrollbar {
    width: 4px !important;
}
.leaflet-popup-content::-webkit-scrollbar-track {
    background: #1A1A18 !important;
}
.leaflet-popup-content::-webkit-scrollbar-thumb {
    background: #2C3E4A !important;
    border-radius: 4px !important;
}

/* ── Capa de barrios sin eventos de ratón ────────────────── */
.leaflet-pane.leaflet-pane_barrios_medellin_1-pane {
    pointer-events: none !important;
}

/* ── Móvil: todo a una columna ───────────────────────────── */
@media (max-width: 480px) {
    .leaflet-popup-content-wrapper {
        overflow-x: hidden !important;
    }
    .leaflet-popup-content table {
        grid-template-columns: 1fr !important;
    }
    .leaflet-popup-content table tr,
    .leaflet-popup-content table tr.leem-foto,
    .leaflet-popup-content table tr.leem-foto + tr.leem-lugar,
    .leaflet-popup-content table tr.leem-cita,
    .leaflet-popup-content table tr.leem-cita + tr.leem-ruta {
        grid-column: 1 / -1 !important;
        grid-row: auto !important;
    }
    .leaflet-popup-content table tr {
        grid-template-columns: 1fr !important;
        padding: 9px 18px !important;
    }
    .leaflet-popup-content table td {
        text-align: left !important;
        border-left: none !important;
        padding: 3px 0 0 0 !important;
    }
    .leaflet-popup-content table tr.leem-foto {
        min-height: 175px !important;
        padding: 0 !important;
    }
    .leaflet-popup-content table tr.leem-foto + tr.leem-lugar {
        padding: 16px 34px 14px 18px !important;
    }
    .leaflet-popup-content table tr.leem-cita {
        padding: 14px 18px !important;
    }
    .leaflet-popup-content table tr.leem-cita + tr.leem-ruta {
        padding: 4px 18px 14px !important;
    }
}

</style>

</head>

        <script src="js/qgis2web_expressions.js"></script>

        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:19, minZoom:1
        }).fitBounds([[6.248910953377774,-75.56747445160133],[6.250465873573315,-75.56439305487237]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_Positronnolabels_0');
        map.getPane('pane_Positronnolabels_0').style.zIndex = 400;
        var layer_Positronnolabels_0 = L.tileLayer('https://a.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_273g_1_29e95d9f3b98267fe22d5e20', {
            pane: 'pane_Positronnolabels_0',
            opacity: 1.0,
            attribution: '<a href="https://cartodb.com/basemaps/">Map tiles by CartoDB, under CC BY 4.0. Data by OpenStreetMap, under ODbL.</a>',
            minZoom: 1,
            maxZoom: 19,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_Positronnolabels_0;
        map.addLayer(layer_Positronnolabels_0);
        function pop_barrios_medellin_1(feature, layer) {
            // Interactividad desactivada — LEEM script
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['CODIGO'] !== null ? autolinker.link(String(feature.properties['CODIGO']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['NOMBRE'] !== null ? autolinker.link(String(feature.properties['NOMBRE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['ABREVIATUR'] !== null ? autolinker.link(String(feature.properties['ABREVIATUR']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['IDENTIFICA'] !== null ? autolinker.link(String(feature.properties['IDENTIFICA']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['LIMITECOMU'] !== null ? autolinker.link(String(feature.properties['LIMITECOMU']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['ZHFISICAGE'] !== null ? autolinker.link(String(feature.properties['ZHFISICAGE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['LIMITEMUNI'] !== null ? autolinker.link(String(feature.properties['LIMITEMUNI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['VIGENCIA_F'] !== null ? autolinker.link(String(feature.properties['VIGENCIA_F']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['SUBTIPO_BA'] !== null ? autolinker.link(String(feature.properties['SUBTIPO_BA']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['LINK_DOCUM'] !== null ? autolinker.link(String(feature.properties['LINK_DOCUM']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_barrios_medellin_1_0() {
            return {
                pane: 'pane_barrios_medellin_1',
                opacity: 1,
                color: 'rgba(200,196,188,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(232,113,141,0.0)',
                interactive: false,
            }
        }
        map.createPane('pane_barrios_medellin_1');
        map.getPane('pane_barrios_medellin_1').style.zIndex = 401;
        map.getPane('pane_barrios_medellin_1').style['mix-blend-mode'] = 'normal';
        map.getPane('pane_barrios_medellin_1').style['pointer-events'] = 'none';
        var layer_barrios_medellin_1 = new L.geoJson(json_barrios_medellin_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_barrios_medellin_1',
            layerName: 'layer_barrios_medellin_1',
            pane: 'pane_barrios_medellin_1',
            onEachFeature: pop_barrios_medellin_1,
            style: style_barrios_medellin_1_0,
        });
        bounds_group.addLayer(layer_barrios_medellin_1);
        map.addLayer(layer_barrios_medellin_1);
        function pop_Literaturaenelmapa_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr class="leem-foto">\
                        <td colspan="2" class="visible-with-data" id="image_url">' + (feature.properties['image_url'] !== null ? '<img src="images/' + String(feature.properties['image_url']).replace(/'/g, '\'') + '">' : '') + '</td>\
                    </tr>\
                    <tr class="leem-lugar">\
                        <td colspan="2" id="lugar">' + (feature.properties['lugar'] !== null ? autolinker.link(String(feature.properties['lugar']).replace(/'/g, '\'').toLocaleString()) : '') + (feature.properties['ciudad'] !== null ? '<div class="leem-ciudad">' + String(feature.properties['ciudad']) + '</div>' : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Obra</th>\
                        <td>' + (feature.properties['titulo_lib'] !== null ? autolinker.link(String(feature.properties['titulo_lib']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Autor</th>\
                        <td class="visible-with-data" id="autor">' + (feature.properties['autor'] !== null ? autolinker.link(String(feature.properties['autor']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Año de publicación</th>\
                        <td class="visible-with-data" id="anio_pub">' + (feature.properties['anio_pub'] !== null ? autolinker.link(String(feature.properties['anio_pub']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Género</th>\
                        <td class="visible-with-data" id="genero">' + (feature.properties['genero'] !== null ? autolinker.link(String(feature.properties['genero']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Etiquetas</th>\
